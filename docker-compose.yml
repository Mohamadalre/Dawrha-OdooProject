services:

  db:
    image: postgres:16
    container_name: odoo19-db
    restart: always
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data
 

  odoo:
    # Build the Dawrha image (base Odoo 19 + Arabic fonts + pip requirements +
    # odoo.conf + the addon). `image:` names the built artifact so it can be
    # pushed to a registry for deploy.
    build:
      context: .
      dockerfile: Dockerfile
    image: dawrha/odoo:19
    container_name: odoo19
    restart: always
    depends_on:
      - db
    ports:
      - "8069:8069"
    # Lets the container reach a backend running on the HOST via
    # http://host.docker.internal:<port>. Without it the outbound sync pings
    # (fleet / warehouse / inventory / suggestions) cannot leave the container to
    # a host-run NestJS backend, so a truck/warehouse added in Odoo silently
    # never reaches the backend. `host-gateway` is resolved by Docker to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      # ── Dynamic backend sync (per-environment) ───────────────────────────
      # The addon's post_init_hook reads these on install/upgrade and writes the
      # matching recycle.backend_* system parameters — so the SAME image syncs
      # correctly in dev, staging and production by env alone, no manual DB edit.
      # Set the secret (and, in production, the real URL) in a `.env` file beside
      # this compose (see .env.example). The secret MUST match the backend's
      # ODOO_WEBHOOK_SECRET, or the backend rejects the pings (401).
      RECYCLE_BACKEND_BASE_URL: ${RECYCLE_BACKEND_BASE_URL:-http://host.docker.internal:3000}
      RECYCLE_BACKEND_WEBHOOK_SECRET: ${RECYCLE_BACKEND_WEBHOOK_SECRET:-}
      RECYCLE_BACKEND_API_KEY: ${RECYCLE_BACKEND_API_KEY:-}
    volumes:
      - odoo-web:/var/lib/odoo
      # DEV ONLY: bind-mount the addon over the baked copy so local edits take
      # effect without a rebuild. For a production deploy, REMOVE this line and
      # rely on the addon baked into the image (reproducible artifact).
      - ./addons:/mnt/extra-addons

  pgadmin:
    image: dpage/pgadmin4
    container_name: odoo19-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  odoo-db:
  odoo-web: